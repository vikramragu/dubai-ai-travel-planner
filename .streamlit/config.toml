[browser]
gatherUsageStats = false

[server]
# Never wait for interactive input (the first-run email prompt). Streamlit Cloud has no
# keyboard: with headless = false the server blocked on that prompt and never started.
headless = true
# Uploads are only trip files the app downloaded (a few KB), so 1 MB is plenty; the default
# hint "200MB per file" confused people.
maxUploadSize = 1
